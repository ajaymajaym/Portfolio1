{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — Server Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>
<body>
    <div class="error-page d-flex align-items-center justify-content-center">
        <div class="text-center">
            <h1 class="error-code">500</h1>
            <p class="error-icon"><i class="bi bi-exclamation-triangle-fill"></i></p>
            <h2 class="mb-3">Something Went Wrong</h2>
            <p class="text-muted mb-4">An unexpected error occurred on our end. Please try again shortly.</p>
            <a href="/" class="btn btn-primary-gradient btn-lg">
                <i class="bi bi-house-fill me-2"></i>Back to Home
            </a>
        </div>
    </div>
</body>
</html>
